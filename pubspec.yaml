name: repdb_example_flutter
description: "Flutter starter that browses the RepDB public flat exercise dataset."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/exercises.json
    - assets/images/flat/
    - assets/images/samples/
    - assets/images/muscles/
    - assets/images/equipment/
